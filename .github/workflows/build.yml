name: Build NX513J Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-9-aarch64-linux-gnu bc libssl-dev libelf-dev make python3 bison flex binutils-aarch64-linux-gnu

    - name: Fix build issues
      run: |
        sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped
        sed -i 's/obj-$(CONFIG_BATTERY_BQ27520)/obj-n/' drivers/power/Makefile
        
    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make lineageos_nx512j_defconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-Image.gz-dtb
        path: arch/arm/boot/Image.gz-dtb
        if-no-files-found: warn

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
