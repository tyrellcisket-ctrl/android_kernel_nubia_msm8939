name: Build NX513J Kernel

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          bc libssl-dev libelf-dev \
          make python3 bison flex \
          binutils-aarch64-linux-gnu

    - name: Fix Python3 compatibility
      run: |
        # 修复 gcc-wrapper.py
        sed -i 's/print "error, forbidden warning:", m.group(2)/print("error, forbidden warning:", m.group(2))/' scripts/gcc-wrapper.py
        sed -i '/for line in proc.stderr:/a\            line = line.decode("utf-8", errors="replace")' scripts/gcc-wrapper.py
        # 修复 yylloc 多重定义 (GCC 10+)
        sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make lineageos_nx512j_defconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
        echo "Build exit code: $?"

    - name: Upload kernel image
      uses: actions/upload-artifact@v3
      with:
        name: kernel-Image.gz-dtb
        path: arch/arm64/boot/Image.gz-dtb
        if-no-files-found: warn

    - name: Upload build log
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: build-log
        path: build.log
